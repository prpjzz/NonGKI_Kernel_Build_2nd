name: Build msm-4.14 Kernel

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "floral"
  DEVICE_CODENAME : "floral"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "DTC_EXT=$GITHUB_WORKSPACE/dtc LD=ld.lld LLVM=1 LLVM_IAS=1 HOSTLD=ld.lld HOSTAR=llvm-ar HOSTCXXFLAGS=-Wno-deprecated-declarations AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=llvm-readelf HOSTCC=clang HOSTCXX=clang++ LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang-custom/lib"

  KERNEL_SOURCE : "https://github.com/LineageOS/android_kernel_google_msm-4.14"
  KERNEL_BRANCH : "lineage-24.0"

  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/3b86e40facfff1eab4065614255d573293c10373/clang-r614150.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "floral_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "bakasu" # xxksu, rsuntk, next, bakasu and sukisu

  SUSFS_ENABLE : false
  SUSFS_FIXED : false

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : true
  NEED_SAFE_DTBO : false

  ROM_TEXT : "lineageos-based"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "true" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "true" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "true" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "false" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom-base" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Build Floral Kernel
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-24.04
    container: ubuntu:focal # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛠️ Setup Container Environment
        run: |
          echo 'APT::Get::Assume-Yes "true";' > /etc/apt/apt.conf.d/90assumeyes
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get remove -y g++-multilib gcc-multilib || true
          apt-get autoremove -y || true
          apt-get install -y --no-install-recommends \
            sudo git wget ca-certificates \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            python3 python3-setuptools python-is-python3 \
            bc flex bison libssl-dev libelf-dev libncurses5 libtinfo5 \
            libc6-dev libncurses-dev lz4 zip unzip
          git config --global --add safe.directory '*'
        shell: bash



      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: Get AOSP dtc
        run: |
          curl -sSL "https://android.googlesource.com/platform/prebuilts/misc/+/master/linux-x86/dtc/dtc?format=TEXT" \
              | base64 -d > "$GITHUB_WORKSPACE/dtc"
          chmod +x "$GITHUB_WORKSPACE/dtc"
          "$GITHUB_WORKSPACE/dtc" --version 

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel

          ./scripts/config --file "arch/${KERNEL_ARCH}/configs/${DEFCONFIG_NAME}" \
            --enable CONFIG_THINLTO \
            --enable CONFIG_EROFS_FS_XATTR \
            --enable CONFIG_EROFS_FS_POSIX_ACL \
            --enable CONFIG_EROFS_FS_SECURITY \
            --enable CONFIG_EROFS_FS_ZIP

          # sysctl knobs
          curl -L https://github.com/LineageOS/android_kernel_google_msm-4.14/commit/a7eb8e429c407cf79f8852fdf73155f42ada180a.patch > 1.patch
          patch -p1 < 1.patch

          # WireGuard
          curl -L https://github.com/LineageOS/android_kernel_google_msm-4.14/commit/ab7d27f1cd1b1204e94bf1335d839973dbf155f6.patch > 2.patch
          patch -p1 < 2.patch 
          
          # kallsyms: increase length to 512
          curl -L https://github.com/LineageOS/android_kernel_google_msm-4.14/commit/402c88b0de0d0fbc5e93790bcb982a18d768270a.patch > 3.patch
          patch -p1 < 3.patch

          # PM/Freezer: Reduce freeze timeout to 1 second for Android
          curl -L https://github.com/kerneltoast/android_kernel_google_floral/commit/a7ef52846d33c87e793f021c4f754478d38f37a3.patch > 4.patch
          patch -p1 < 4.patch

          # PM / wakeup: Avoid excessive s2idle wake attempts in pm_system_wakeup()
          curl -L https://github.com/kerneltoast/android_kernel_google_floral/commit/851f9989ed1607a2aa729a6b360e8a36ce088b79.patch > 5.patch
          patch -p1 < 5.patch

          # PM / suspend: Clear wakeups before running PM callbacks
          curl -L https://github.com/kerneltoast/android_kernel_google_floral/commit/72b078af900a9e959c95cb8ab546ffd18a088c07.patch > 6.patch
          patch -p1 < 6.patch

          # PM / freezer: Abort suspend when there's a wakeup while freezing
          curl -L https://github.com/kerneltoast/android_kernel_google_floral/commit/ffd7943b5013cb63143106063f451212f83ddfe2.patch > 7.patch
          patch -p1 < 7.patch

          # cgroup patches
          curl -L https://github.com/crdroidandroid/android_kernel_xiaomi_sm8150/commit/3ce1d0fab16b615e1d593ed76f7682e7def21b4f.patch > 8.patch
          patch -p1 < 8.patch

          curl -L https://github.com/crdroidandroid/android_kernel_xiaomi_sm8150/commit/46893d8a37467f5ed2b4d032662ff389618d9fd5.patch > 9.patch
          patch -p1 < 9.patch

          curl -L https://github.com/crdroidandroid/android_kernel_xiaomi_sm8150/commit/c469088536cc5e06b35956f82f0a6ea71c105ac0.patch > 10.patch
          patch -p1 < 10.patch

          curl -L https://github.com/crdroidandroid/android_kernel_xiaomi_sm8150/commit/dbff509e40cd75f04a212b92319167db0a29d93f.patch > 11.patch
          patch -p1 < 11.patch
          
          echo "CONFIG_LOCALVERSION="-perf"" >> arch/${KERNEL_ARCH}/configs/${DEFCONFIG_NAME}
          

          printf -- '-g%s' "$(git rev-parse --short=12 HEAD)" > .scmversion
          # Patch Makefile to suppress unknown warnings and GNU layout structures
          echo "[+] Patching Makefile to bypass errors"
          echo "KBUILD_CFLAGS += -Wno-error -Wno-unknown-warning-option -Wno-gnu-variable-sized-type-not-at-end -Wno-initializer-overrides -Wno-pointer-sign -Wno-asm-operand-widths -Wno-tautological-compare -Wno-implicit-function-declaration -w" >> Makefile
          echo "KBUILD_HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile
          echo "HOSTCFLAGS += -Wno-error -Wno-unknown-warning-option -w" >> Makefile
          # Nothing

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
